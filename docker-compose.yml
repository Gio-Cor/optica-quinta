version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: optica_db
    restart: always
    environment:
      POSTGRES_USER: optica_user
      POSTGRES_PASSWORD: optica_password
      POSTGRES_DB: optica_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: optica_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://optica_user:optica_password@db:5432/optica_db
      - JWT_SECRET=super_secret_optica_key_123!
      - PORT=3001
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: optica_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
